#!name=出行登记助手（Shadowrocket）
#!desc=微信登录校园平台后自动捕获 JSESSIONID；点击通知直达 QLIT。提交仅可手动运行，绝不定时自动提交。
#!system=ios
# ============================================================
# Shadowrocket 配置片段：出行登记助手
# ============================================================
# 两种用法任选其一：
#
# 1) 推荐：在 Shadowrocket「设置 → 脚本」和「设置 → HTTPS 解密」里
#    按 README「Shadowrocket 安装方式」手动添加（真机友好、可逐项排障）。
#
# 2) 高级：把下面的 [Script] 与 [MITM] 段并入你正在使用的主配置
#    （配置 → 编辑配置(高级) → 相应分区粘贴），保存后生效。
#    注意 %APPEND% 会保留主配置里已有域名；如果主配置没有 [MITM] 段，
#    直接整段复制即可。
# ============================================================

[Script]
QLIT Captor = type=http-response,pattern=^https?:\/\/pass\.qlit\.edu\.cn\/,requires-body=false,timeout=20,script-update-interval=3600,script-path=https://raw.githubusercontent.com/miaodaxia80-droid/ios-proxy-module/main/scripts/qlit-capture.js
QLIT KeepAlive = type=cron,cronexp="*/20 * * * *",timeout=30,script-update-interval=3600,script-path=https://raw.githubusercontent.com/miaodaxia80-droid/ios-proxy-module/main/shadowrocket/qlit-keepalive.js
QLIT Submit = type=generic,timeout=120,script-update-interval=3600,script-path=https://raw.githubusercontent.com/miaodaxia80-droid/ios-proxy-module/main/shadowrocket/qlit-submit.js

[MITM]
hostname = %APPEND% pass.qlit.edu.cn
